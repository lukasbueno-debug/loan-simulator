<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Loan Simulator</title>

  <link rel="stylesheet" href="style.css">

  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
  <script src="actions.js" defer></script>
</head>
<body>
  <main>
    <header>
      <h1>Loan Simulator</h1>
      <p data-text="intro"></p>
    </header>

    <div class="language">
      <label for="language" data-text="language"></label>
      <select id="language">
        <option value="es">Español</option>
        <option value="en">English</option>
      </select>
    </div>

    <form id="loan-form">
      <div>
        <label for="amount" data-text="amount"></label>
        <input id="amount" type="number"
               min="0.01" step="0.01" required>
      </div>

      <div>
        <label for="rate" data-text="rate"></label>
        <input id="rate" type="number"
               min="0" step="any" required>
      </div>

      <div>
        <label for="rate-type" data-text="rateType"></label>
        <select id="rate-type">
          <option value="monthly" data-text="monthly"></option>
          <option value="annual" data-text="annual"></option>
        </select>
      </div>

      <div>
        <label for="months" data-text="months"></label>
        <input id="months" type="number"
               min="1" max="1200" step="1" required>
      </div>

      <button type="submit" data-text="calculate"></button>
    </form>

    <p id="error" role="alert"></p>

    <section id="results" hidden>
      <h2 data-text="result"></h2>
      <p id="details"></p>

      <div class="summary">
        <p>
          <span data-text="payment"></span>
          <strong id="payment"></strong>
        </p>
        <p>
          <span data-text="totalInterest"></span>
          <strong id="total-interest"></strong>
        </p>
        <p>
          <span data-text="totalPaid"></span>
          <strong id="total-paid"></strong>
        </p>
      </div>

      <div class="actions">
        <button id="print-button" type="button"
                data-text="print"></button>
        <button id="pdf-button" type="button"
                data-text="pdf"></button>
      </div>

      <h2 data-text="schedule"></h2>

      <div class="table-container">
        <table>
          <thead>
            <tr>
              <th scope="col" data-text="month"></th>
              <th scope="col" data-text="installment"></th>
              <th scope="col" data-text="interest"></th>
              <th scope="col" data-text="principal"></th>
              <th scope="col" data-text="balance"></th>
            </tr>
          </thead>
          <tbody id="schedule"></tbody>
        </table>
      </div>
    </section>
  </main>
</body>
</html>
