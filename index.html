<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Loan Simulator</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 40px 20px;
      background: #eef3f9;
      color: #172b4d;
      font-family: Arial, sans-serif;
      line-height: 1.5;
    }

    main { max-width: 960px; margin: auto; }

    header { margin-bottom: 28px; }

    h1 {
      margin: 0;
      font-size: clamp(30px, 5vw, 44px);
      color: #102444;
    }

    header p { margin-top: 6px; color: #526480; }

    form, #results {
      padding: 28px;
      border: 1px solid #dbe4ef;
      border-radius: 18px;
      background: white;
      box-shadow: 0 10px 30px #172b4d0a;
    }

    form {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 20px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: bold;
      font-size: 14px;
    }

    input, select {
      width: 100%;
      padding: 13px;
      border: 1px solid #bac9db;
      border-radius: 9px;
      background: #f8fafc;
      color: #172b4d;
      font: inherit;
    }

    input:focus, select:focus {
      outline: 3px solid #b8d5ff;
      outline-offset: 2px;
    }

    button {
      grid-column: 1 / -1;
      padding: 15px;
      border: 0;
      border-radius: 9px;
      background: #1749ba;
      color: white;
      font: inherit;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover { background: #10378f; }

    button:focus-visible {
      outline: 3px solid #2563eb;
      outline-offset: 3px;
    }

    #results { margin-top: 28px; }

    h2 { margin-top: 0; font-size: 22px; }

    .summary {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
      margin-bottom: 28px;
    }

    .summary p {
      margin: 0;
      padding: 16px;
      background: #f1f5fa;
      border-radius: 10px;
      font-size: 14px;
    }

    .summary strong {
      display: block;
      margin-top: 8px;
      color: #08734f;
      font-size: 22px;
      overflow-wrap: anywhere;
    }

    .table-container { overflow-x: auto; }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
      font-variant-numeric: tabular-nums;
    }

    th, td {
      padding: 13px;
      border-bottom: 1px solid #e2e8f0;
      text-align: right;
      white-space: nowrap;
    }

    th { background: #172b4d; color: white; }
    th:first-child, td:first-child { text-align: left; }
    tbody tr:nth-child(even) { background: #f5f8fc; }
    tbody tr:hover { background: #eaf2ff; }

    #error { color: #b42318; font-weight: bold; }
    #error:empty { display: none; }

    @media (max-width: 600px) {
      form, .summary { grid-template-columns: 1fr; }
      form, #results { padding: 20px; }
      body { padding: 24px 14px; }
    }
  </style>
</head>

<body>
  <main>
    <header>
      <h1>Loan Simulator</h1>
      <p>Calcula tu cuota mensual y consulta tu plan de pagos.</p>
    </header>

    <form id="loan-form">
      <div>
        <label for="amount">Monto del préstamo</label>
        <input id="amount" type="number"
               min="0.01" step="0.01" required>
      </div>

      <div>
        <label for="rate">Tasa de interés (%)</label>
        <input id="rate" type="number"
               min="0" step="any" required>
      </div>

      <div>
        <label for="rate-type">Tipo de tasa</label>
        <select id="rate-type">
          <option value="monthly">Efectiva mensual</option>
          <option value="annual">Efectiva anual</option>
        </select>
      </div>

      <div>
        <label for="months">Plazo en meses</label>
        <input id="months" type="number"
               min="1" max="1200" step="1" required>
      </div>

      <button type="submit">
        <span aria-hidden="true">▦</span> Calcular préstamo
      </button>
    </form>

    <p id="error" role="alert"></p>

    <section id="results" hidden>
      <h2>Resultado del préstamo</h2>

      <div class="summary">
        <p>Cuota mensual <strong id="payment"></strong></p>
        <p>Total de intereses <strong id="total-interest"></strong></p>
        <p>Total a pagar <strong id="total-paid"></strong></p>
      </div>

      <h2>Tabla de amortización</h2>

      <div class="table-container">
        <table>
          <thead>
            <tr>
              <th scope="col">Mes</th>
              <th scope="col">Cuota</th>
              <th scope="col">Interés</th>
              <th scope="col">Abono a capital</th>
              <th scope="col">Saldo pendiente</th>
            </tr>
          </thead>
          <tbody id="schedule"></tbody>
        </table>
      </div>
    </section>
  </main>

  <script>
    const form = document.getElementById("loan-form");
    const results = document.getElementById("results");
    const error = document.getElementById("error");
    const schedule = document.getElementById("schedule");

    const format = (value) => value.toLocaleString("es-CO", {
      minimumFractionDigits: 2,
      maximumFractionDigits: 2
    });

    form.addEventListener("submit", function (event) {
      event.preventDefault();

      results.hidden = true;
      error.textContent = "";
      schedule.replaceChildren();

      const amount = Number(document.getElementById("amount").value);
      const rate = Number(document.getElementById("rate").value);
      const months = Number(document.getElementById("months").value);
      const rateType = document.getElementById("rate-type").value;

      if (
        !Number.isFinite(amount) ||
        !Number.isFinite(rate) ||
        amount <= 0 ||
        rate < 0 ||
        !Number.isInteger(months) ||
        months < 1 ||
        months > 1200
      ) {
        error.textContent = "Revisa el monto, la tasa y el plazo.";
        return;
      }

      const monthlyRate = rateType === "annual"
        ? Math.expm1(Math.log1p(rate / 100) / 12)
        : rate / 100;

      const payment = monthlyRate === 0
        ? amount / months
        : amount * monthlyRate /
          (-Math.expm1(-months * Math.log1p(monthlyRate)));

      if (!Number.isFinite(payment)) {
        error.textContent = "Los valores son demasiado grandes.";
        return;
      }

      let balance = amount;
      let totalInterest = 0;
      let totalPaid = 0;
      const rows = document.createDocumentFragment();

      for (let month = 1; month <= months; month++) {
        const interest = balance * monthlyRate;

        const principal = month === months
          ? balance
          : Math.min(balance, Math.max(0, payment - interest));

        const currentPayment = principal + interest;
        balance = Math.max(0, balance - principal);
        totalInterest += interest;
        totalPaid += currentPayment;

        const row = document.createElement("tr");
        const values = [
          month,
          format(currentPayment),
          format(interest),
          format(principal),
          format(balance)
        ];

        for (const value of values) {
          const cell = document.createElement("td");
          cell.textContent = value;
          row.appendChild(cell);
        }

        rows.appendChild(row);
      }

      schedule.appendChild(rows);
      document.getElementById("payment").textContent = format(payment);
      document.getElementById("total-interest").textContent =
        format(totalInterest);
      document.getElementById("total-paid").textContent =
        format(totalPaid);

      results.hidden = false;
    });
  </script>
</body>
</html>
