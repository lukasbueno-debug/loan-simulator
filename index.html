<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Loan Simulator</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 40px 20px;
      background: #eef3f9;
      color: #172b4d;
      font-family: Arial, sans-serif;
      line-height: 1.5;
    }

    main { max-width: 960px; margin: auto; }
    header { margin-bottom: 28px; }
    h1 { margin: 0; font-size: clamp(30px, 5vw, 44px); }
    header p { color: #526480; }
    .language { max-width: 220px; margin-bottom: 24px; }

    form, #results {
      padding: 28px;
      border: 1px solid #dbe4ef;
      border-radius: 18px;
      background: white;
      box-shadow: 0 10px 30px #172b4d0a;
    }

    form {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 20px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: bold;
      font-size: 14px;
    }

    input, select {
      width: 100%;
      padding: 13px;
      border: 1px solid #bac9db;
      border-radius: 9px;
      background: #f8fafc;
      color: #172b4d;
      font: inherit;
    }

    input:focus, select:focus {
      outline: 3px solid #b8d5ff;
      outline-offset: 2px;
    }

    button {
      padding: 15px;
      border: 0;
      border-radius: 9px;
      background: #1749ba;
      color: white;
      font: inherit;
      font-weight: bold;
      cursor: pointer;
    }

    form button { grid-column: 1 / -1; }
    button:hover { background: #10378f; }

    button:focus-visible {
      outline: 3px solid #2563eb;
      outline-offset: 3px;
    }

    #results { margin-top: 28px; }
    h2 { margin-top: 0; font-size: 22px; }

    .summary {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
      margin-bottom: 28px;
    }

    .summary p {
      margin: 0;
      padding: 16px;
      background: #f1f5fa;
      border-radius: 10px;
      font-size: 14px;
    }

    .summary strong {
      display: block;
      margin-top: 8px;
      color: #08734f;
      font-size: 22px;
      overflow-wrap: anywhere;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin: 24px 0;
    }

    .table-container { overflow-x: auto; }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
      font-variant-numeric: tabular-nums;
    }

    th, td {
      padding: 13px;
      border-bottom: 1px solid #e2e8f0;
      text-align: right;
      white-space: nowrap;
    }

    th { background: #172b4d; color: white; }
    th:first-child, td:first-child { text-align: left; }
    tbody tr:nth-child(even) { background: #f5f8fc; }
    #error { color: #b42318; font-weight: bold; }
    #error:empty { display: none; }

    @media (max-width: 600px) {
      form, .summary { grid-template-columns: 1fr; }
      form, #results { padding: 20px; }
      body { padding: 24px 14px; }
    }

    @media print {
      @page { size: A4; margin: 15mm; }

      body {
        padding: 0;
        background: white;
        color: black;
      }

      .language, form, .actions, #error { display: none; }

      #results {
        border: 0;
        box-shadow: none;
        padding: 0;
      }

      .summary { grid-template-columns: repeat(3, 1fr); }
      .summary strong { font-size: 16px; }
      .table-container { overflow: visible; }
      table { font-size: 10px; }
      th, td { padding: 6px; white-space: normal; }
      th { background: white; color: black; }
      thead { display: table-header-group; }
      tr { break-inside: avoid; }
    }
  </style>

  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
</head>

<body>
  <main>
    <header>
      <h1>Loan Simulator</h1>
      <p data-text="intro"></p>
    </header>

    <div class="language">
      <label for="language" data-text="language"></label>
      <select id="language">
        <option value="es">Español</option>
        <option value="en">English</option>
      </select>
    </div>

    <form id="loan-form">
      <div>
        <label for="amount" data-text="amount"></label>
        <input id="amount" type="number"
               min="0.01" step="0.01" required>
      </div>

      <div>
        <label for="rate" data-text="rate"></label>
        <input id="rate" type="number"
               min="0" step="any" required>
      </div>

      <div>
        <label for="rate-type" data-text="rateType"></label>
        <select id="rate-type">
          <option value="monthly" data-text="monthly"></option>
          <option value="annual" data-text="annual"></option>
        </select>
      </div>

      <div>
        <label for="months" data-text="months"></label>
        <input id="months" type="number"
               min="1" max="1200" step="1" required>
      </div>

      <button type="submit" data-text="calculate"></button>
    </form>

    <p id="error" role="alert"></p>

    <section id="results" hidden>
      <h2 data-text="result"></h2>
      <p id="details"></p>

      <div class="summary">
        <p>
          <span data-text="payment"></span>
          <strong id="payment"></strong>
        </p>
        <p>
          <span data-text="totalInterest"></span>
          <strong id="total-interest"></strong>
        </p>
        <p>
          <span data-text="totalPaid"></span>
          <strong id="total-paid"></strong>
        </p>
      </div>

      <div class="actions">
        <button id="print-button" type="button"
                data-text="print"></button>
        <button id="pdf-button" type="button"
                data-text="pdf"></button>
      </div>

      <h2 data-text="schedule"></h2>

      <div class="table-container">
        <table>
          <thead>
            <tr>
              <th scope="col" data-text="month"></th>
              <th scope="col" data-text="installment"></th>
              <th scope="col" data-text="interest"></th>
              <th scope="col" data-text="principal"></th>
              <th scope="col" data-text="balance"></th>
            </tr>
          </thead>
          <tbody id="schedule"></tbody>
        </table>
      </div>
    </section>
  </main>

  <script>
    const translations = {
      es: {
        intro: "Calcula tu cuota mensual y consulta tu plan de pagos.",
        language: "Idioma",
        amount: "Monto del préstamo",
        rate: "Tasa de interés (%)",
        rateType: "Tipo de tasa",
        monthly: "Efectiva mensual",
        annual: "Efectiva anual",
        months: "Plazo en meses",
        calculate: "Calcular préstamo",
        result: "Resultado del préstamo",
        payment: "Cuota mensual",
        totalInterest: "Total de intereses",
        totalPaid: "Total a pagar",
        schedule: "Tabla de amortización",
        month: "Mes",
        installment: "Cuota",
        interest: "Interés",
        principal: "Abono a capital",
        balance: "Saldo pendiente",
        print: "Imprimir",
        pdf: "Descargar PDF",
        invalid: "Revisa el monto, la tasa y el plazo.",
        tooLarge: "Los valores son demasiado grandes.",
        pdfError: "No se pudo generar el PDF. Revisa tu conexión y recarga la página."
      },

      en: {
        intro: "Calculate your monthly payment and view your repayment plan.",
        language: "Language",
        amount: "Loan amount",
        rate: "Interest rate (%)",
        rateType: "Interest rate type",
        monthly: "Effective monthly",
        annual: "Effective annual",
        months: "Term in months",
        calculate: "Calculate loan",
        result: "Loan results",
        payment: "Monthly payment",
        totalInterest: "Total interest",
        totalPaid: "Total repayment",
        schedule: "Amortization schedule",
        month: "Month",
        installment: "Payment",
        interest: "Interest",
        principal: "Principal repayment",
        balance: "Remaining balance",
        print: "Print",
        pdf: "Download PDF",
        invalid: "Check the amount, interest rate and term.",
        tooLarge: "The values are too large.",
        pdfError: "Could not generate the PDF. Check your connection and reload the page."
      }
    };

    const form = document.getElementById("loan-form");
    const results = document.getElementById("results");
    const error = document.getElementById("error");
    const schedule = document.getElementById("schedule");

    let language = "es";
    let simulation = null;
    let errorKey = "";

    function format(value) {
      return value.toLocaleString(
        language === "es" ? "es-CO" : "en-US",
        {
          minimumFractionDigits: 2,
          maximumFractionDigits: 2
        }
      );
    }

    function details() {
      const t = translations[language];

      return `${t.amount}: ${format(simulation.amount)} | ` +
        `${t.rate}: ${simulation.rate} | ` +
        `${t[simulation.rateType]} | ` +
        `${t.months}: ${simulation.months}`;
    }

    function renderResults() {
      schedule.replaceChildren();
      results.hidden = simulation === null;

      if (!simulation) return;

      document.getElementById("details").textContent = details();
      document.getElementById("payment").textContent =
        format(simulation.payment);
      document.getElementById("total-interest").textContent =
        format(simulation.totalInterest);
      document.getElementById("total-paid").textContent =
        format(simulation.totalPaid);

      const fragment = document.createDocumentFragment();

      for (const values of simulation.rows) {
        const row = document.createElement("tr");

        values.forEach((value, index) => {
          const cell = document.createElement("td");
          cell.textContent = index === 0 ? value : format(value);
          row.appendChild(cell);
        });

        fragment.appendChild(row);
      }

      schedule.appendChild(fragment);
    }

    function applyLanguage() {
      document.documentElement.lang = language;

      document.querySelectorAll("[data-text]").forEach(element => {
        element.textContent =
          translations[language][element.dataset.text];
      });

      error.textContent = errorKey
        ? translations[language][errorKey]
        : "";

      renderResults();
    }

    document.getElementById("language")
      .addEventListener("change", function () {
        language = this.value;
        applyLanguage();
      });

    form.addEventListener("submit", function (event) {
      event.preventDefault();

      simulation = null;
      errorKey = "";
      error.textContent = "";
      renderResults();

      const amount =
        Number(document.getElementById("amount").value);
      const rate =
        Number(document.getElementById("rate").value);
      const months =
        Number(document.getElementById("months").value);
      const rateType =
        document.getElementById("rate-type").value;

      if (
        !Number.isFinite(amount) ||
        !Number.isFinite(rate) ||
        amount <= 0 ||
        rate < 0 ||
        !Number.isInteger(months) ||
        months < 1 ||
        months > 1200
      ) {
        errorKey = "invalid";
        applyLanguage();
        return;
      }

      const monthlyRate = rateType === "annual"
        ? Math.expm1(Math.log1p(rate / 100) / 12)
        : rate / 100;

      const payment = monthlyRate === 0
        ? amount / months
        : amount * monthlyRate /
          (-Math.expm1(-months * Math.log1p(monthlyRate)));

      if (!Number.isFinite(payment)) {
        errorKey = "tooLarge";
        applyLanguage();
        return;
      }

      let balance = amount;
      let totalInterest = 0;
      let totalPaid = 0;
      const rows = [];

      for (let month = 1; month <= months; month++) {
        const interest = balance * monthlyRate;

        const principal = month === months
          ? balance
          : Math.min(balance, Math.max(0, payment - interest));

        const currentPayment = principal + interest;

        balance = Math.max(0, balance - principal);
        totalInterest += interest;
        totalPaid += currentPayment;

        rows.push([
          month,
          currentPayment,
          interest,
          principal,
          balance
        ]);
      }

      simulation = {
        amount,
        rate,
        rateType,
        months,
        payment,
        totalInterest,
        totalPaid,
        rows
      };

      renderResults();
    });

    document.getElementById("print-button")
      .addEventListener("click", () => {
        if (simulation) window.print();
      });

    document.getElementById("pdf-button")
      .addEventListener("click", () => {
        if (!simulation) return;

        try {
          const t = translations[language];
          const doc = new window.jspdf.jsPDF();

          doc.setFontSize(20);
          doc.text("Loan Simulator", 14, 20);
          doc.setFontSize(10);

          const lines = doc.splitTextToSize(details(), 180);
          doc.text(lines, 14, 30);

          const y = 30 + lines.length * 5 + 7;

          doc.text(
            `${t.payment}: ${format(simulation.payment)}`,
            14, y
          );

          doc.text(
            `${t.totalInterest}: ${format(simulation.totalInterest)}`,
            14, y + 7
          );

          doc.text(
            `${t.totalPaid}: ${format(simulation.totalPaid)}`,
            14, y + 14
          );

          doc.autoTable({
            startY: y + 23,
            head: [[
              t.month,
              t.installment,
              t.interest,
              t.principal,
              t.balance
            ]],
            body: simulation.rows.map(row =>
              row.map((value, index) =>
                index === 0 ? value : format(value)
              )
            ),
            theme: "striped",
            headStyles: { fillColor: [23, 43, 77] },
            styles: { fontSize: 9 },
            margin: {
              top: 15,
              right: 14,
              bottom: 15,
              left: 14
            }
          });

          doc.save("loan-simulator.pdf");
          errorKey = "";
          error.textContent = "";
        } catch (problem) {
          errorKey = "pdfError";
          error.textContent = translations[language][errorKey];
        }
      });

    applyLanguage();
  </script>
</body>
</html>
